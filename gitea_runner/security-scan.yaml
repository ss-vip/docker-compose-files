# Gitea 專案請放在 .github/workflows/security-scan.yaml，搭配 Gitea runner 執行。
name: Security Scan

on:
  push:
  pull_request:

jobs:
  scan:
    # Semgrep、Trivy 及 Python 由 security 標籤對應的掃描映像提供。
    runs-on: security
    timeout-minutes: 30
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4
        with:
          # 掃描目前 checkout 的檔案，不需要下載完整 Git 歷史。
          persist-credentials: false

      - name: Scan and build redacted reports
        id: scans
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          # 將報告存到暫存目錄，避免掃描器再掃到報告。
          reports="$(mktemp -d)"
          printf 'reports=%s\n' "$reports" >> "$GITHUB_OUTPUT"
          python3 - "$reports" <<'PY'
          import html
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from http.client import HTTPException
          from urllib.request import Request, urlopen

          reports = Path(sys.argv[1])
          # 依序執行靜態分析、相依套件與設定檢查，以及獨立的憑證掃描。
          scans = (
              ("Semgrep SAST", "semgrep-results.sarif", [
                  "semgrep", "scan", "--config", "p/security-audit",
                  "--metrics=off", "--severity", "ERROR", "--strict", "--sarif", ".",
              ]),
              ("Trivy SCA / misconfiguration", "trivy-results.sarif", [
                  "trivy", "fs", "--quiet", "--scanners", "vuln,misconfig",
                  "--severity", "HIGH,CRITICAL", "--format", "sarif", ".",
              ]),
              ("Trivy secret scan", "secret-results.json", [
                  "trivy", "fs", "--quiet", "--scanners", "secret", "--format", "json", ".",
              ]),
          )

          # SARIF 只保留規則、等級及位置，避免輸出原始訊息或程式碼片段。
          def redacted_sarif(data, scanner):
              runs = data["runs"]
              if not isinstance(runs, list) or not runs:
                  raise ValueError("missing SARIF runs")
              findings = []
              for run in runs:
                  for result in run.get("results", []):
                      finding = {
                          "ruleId": result["ruleId"],
                          "message": {"text": "Finding reported by " + scanner},
                      }
                      if result.get("level") in {"none", "note", "warning", "error"}:
                          finding["level"] = result["level"]
                      locations = []
                      for location in result.get("locations", []):
                          physical = location.get("physicalLocation", {})
                          uri = physical.get("artifactLocation", {}).get("uri")
                          if not uri:
                              continue
                          safe = {"artifactLocation": {"uri": uri}}
                          line = physical.get("region", {}).get("startLine")
                          if isinstance(line, int) and line > 0:
                              safe["region"] = {"startLine": line}
                          locations.append({"physicalLocation": safe})
                      if locations:
                          finding["locations"] = locations
                      findings.append(finding)
              report = {"version": "2.1.0", "runs": [{
                  "tool": {"driver": {"name": scanner}}, "results": findings,
              }]}
              return report, len(findings)

          def run_scan(scanner, filename, command):
              if os.environ.get("CHECKOUT_OUTCOME") != "success":
                  return "INCOMPLETE (checkout failed)"
              try:
                  proc = subprocess.run(
                      command, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                      timeout=360, check=False,
                  )
                  if proc.returncode:
                      return f"INCOMPLETE (scanner exit {proc.returncode})"
                  data = json.loads(proc.stdout)
                  if filename.endswith(".sarif"):
                      report, count = redacted_sarif(data, scanner)
                  else:
                      if not isinstance(data.get("SchemaVersion"), int) or "ArtifactType" not in data:
                          raise ValueError("invalid Trivy report")
                      count = sum(len(target.get("Secrets") or []) for target in data.get("Results") or [])
                      # 憑證報告只留筆數，原值與位置都不寫入附件。
                      report = {"finding_count": count, "credential_values": "[REDACTED]"}
                  (reports / filename).write_text(json.dumps(report, ensure_ascii=False), encoding="utf-8")
              except subprocess.TimeoutExpired:
                  return "INCOMPLETE (scanner timed out)"
              except FileNotFoundError:
                  return "INCOMPLETE (scanner unavailable)"
              except (OSError, ValueError, TypeError, KeyError, AttributeError):
                  return "INCOMPLETE (report unavailable or invalid)"
              if count and filename == "secret-results.json":
                  print(f"::warning title=Possible credential exposure::{count} finding(s); values redacted.")
              return f"FINDINGS ({count})" if count else "COMPLETE (no findings)"

          def version_tuple(value):
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", value.strip(), re.ASCII)
              return tuple(map(int, match.groups())) if match else None

          # 版本由掃描映像統一管理，這裡只記錄實際版本並提示新版。
          def tool_version(name, command, upstream):
              installed = None
              latest = None
              try:
                  probe = subprocess.run(
                      [command, "--version"], stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL, timeout=5, check=False,
                      env={**os.environ, "SEMGREP_ENABLE_VERSION_CHECK": "0"},
                  )
                  if probe.returncode == 0:
                      for line in probe.stdout.decode("utf-8", errors="replace").splitlines():
                          installed = version_tuple(line.removeprefix("Version:").strip())
                          if installed:
                              break
              except (OSError, subprocess.TimeoutExpired, ValueError):
                  pass
              try:
                  request = Request(
                      f"https://api.github.com/repos/{upstream}/releases/latest",
                      headers={"Accept": "application/vnd.github+json", "User-Agent": "gitea-security-scan"},
                  )
                  with urlopen(request, timeout=5) as response:
                      # Trivy 的 release 可能附有大量檔案，回應會超過 64 KiB。
                      limit = 1024 * 1024
                      payload = response.read(limit + 1)
                  if len(payload) > limit:
                      raise ValueError("release response exceeds size limit")
                  release = json.loads(payload)
                  latest = version_tuple(release["tag_name"])
              except (OSError, HTTPException, ValueError, KeyError, TypeError, AttributeError):
                  pass

              installed_text = ".".join(map(str, installed)) if installed else "無法確認實際版本"
              line = f"{name} 實際版本：{installed_text}"
              if latest is None:
                  return f"{line}｜無法確認最新版"
              latest_text = ".".join(map(str, latest))
              if installed is not None and latest > installed:
                  return f"{line}｜有新版：{latest_text}"
              return f"{line}｜官方最新版：{latest_text}"

          descriptions = {
              "Semgrep SAST": "靜態分析原始碼，找出符合安全規則的高風險寫法（ERROR）。",
              "Trivy SCA / misconfiguration": "檢查相依套件已知弱點與基礎設施設定錯誤（HIGH、CRITICAL）。",
              "Trivy secret scan": "檢查目前檔案中的疑似 token、密碼與私鑰。報告只保留筆數。",
          }
          lines = []
          scan_rows = []
          for scanner, filename, command in scans:
              status = run_scan(scanner, filename, command)
              line = f"{scanner}: {status}"
              print(line)
              lines.append(line)
              scan_rows.append((scanner, descriptions[scanner], status))

          versions = [
              tool_version("Semgrep", "semgrep", "semgrep/semgrep"),
              tool_version("Trivy", "trivy", "aquasecurity/trivy"),
          ]
          for version in versions:
              print(version)
          summary = "\n".join(lines + ["", "工具版本", *versions]) + "\n"
          (reports / "scan-status.txt").write_text(summary, encoding="utf-8")
          # 合成 HTML 表格。執行時間可在 Gitea Actions 頁面查看。
          def table(headers, rows):
              headings = "".join(f'<th scope="col">{html.escape(value)}</th>' for value in headers)
              body = []
              for row in rows:
                  cells = "".join(f"<td>{html.escape(value)}</td>" for value in row)
                  body.append(f"<tr>{cells}</tr>")
              return f"<table><thead><tr>{headings}</tr></thead><tbody>{''.join(body)}</tbody></table>"

          version_rows = [version.split("｜", 1) for version in versions]
          report_html = (
              '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<title>Security Scan Report</title>'
              '<style>body{font-family:system-ui,sans-serif;margin:1.5rem;line-height:1.5}'
              'table{border-collapse:collapse;width:100%;max-width:72rem;margin-bottom:1.5rem}'
              'th,td{border:1px solid #cbd5e1;padding:.55rem .75rem;text-align:left;vertical-align:top}'
              'th{background:#e2e8f0;color:#0f172a}td{overflow-wrap:anywhere}</style></head>'
              '<body><h1>Security Scan Report</h1><h2>掃描結果</h2>'
              + table(("掃描項目", "檢查內容", "結果"), scan_rows)
              + '<p>COMPLETE 表示掃描完成且沒有發現；FINDINGS 表示有發現；'
              'INCOMPLETE 表示掃描未完成。</p>'
              '<h2>工具版本</h2>'
              + table(("工具與實際版本", "新版查詢"), version_rows)
              + '</body></html>'
          )
          (reports / "security-report.html").write_text(report_html, encoding="utf-8")
          # 有發現只作提示，任何一項未完成才將這次掃描標示為失敗。
          if any(": INCOMPLETE" in line for line in lines):
              sys.exit(1)
          PY

      # 即使掃描未完成，仍上傳已產出的 SARIF、憑證摘要及狀態報告。
      - name: Upload security reports
        if: ${{ always() && steps.scans.outputs.reports != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: ${{ steps.scans.outputs.reports }}
          if-no-files-found: error
          retention-days: 14
