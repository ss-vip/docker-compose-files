# docker compose build scanner && docker compose up -d
services:
  runner:
    container_name: gitea_runner
    image: gitea/runner:3.0.0
    restart: always
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Gitea 主機與 Action Runner Token
      - GITEA_INSTANCE_URL=http://127.0.0.1:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=TOKEN
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://node:22-bullseye,security:docker://security-scanner:latest

  # 選用
  scanner:
    profiles: ["tools"]
    image: security-scanner:latest
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        # 更新版本：改版號後重新 build
        RUN apt-get update && apt-get install -y --no-install-recommends \
            curl git ca-certificates \
            && rm -rf /var/lib/apt/lists/*
        RUN curl -sfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz" \
            && tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy \
            && chmod +x /usr/local/bin/trivy \
            && rm /tmp/trivy.tar.gz
        RUN trivy image --download-db-only
        RUN pip install --no-cache-dir "setuptools<81" "semgrep==1.177.0" \
            && semgrep --version
        RUN curl -fsSL https://deb.nodesource.com/setup_20.x | bash - \
            && apt-get install -y --no-install-recommends nodejs \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /workspace
